<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title> Pie Clicker </title>
    <link rel="stylesheet" href="PieClickerStyle.css">
</head>
<body>
    <section id="game"><!--conatiner för själva spelet att klicka på pajen-->
        <h1> Pie Clicker </h1>
        <div id="pies">    <!--contaner för hur mycket poäng man ahr totalt-->
            <p> pies: </p> <span id="score"> <P>0</P> </span>     
        </div>
        <div id="pointsPerClick"> <!--contaner för hur mycket klick man tjänar per minut-->
            <p>pies per click:</p>  <span id="points-per-click"><p> 1</p></span>
        </div>
        <div id="pie-Clicker">
            <img src="pie.png" alt="pie clicker, click to earn points">
            <p>Click this ↑</p>
        </div>
    </section>
    <script src="PieClicker.js"> </script>
</body>
</html>
